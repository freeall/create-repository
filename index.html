<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I Love U 💚</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      overflow: hidden;
    }
    h1 {
      font-size: 4em;
      font-family: monospace;
      color: #00ff99;
      text-shadow: 0 0 10px #00ff99, 0 0 20px #00ff99, 0 0 40px #00ff99;
      animation: glow 2s infinite, move 6s infinite linear;
    }
    @keyframes glow {
      0%, 100% { text-shadow: 0 0 10px #00ff99, 0 0 20px #00ff99; }
      50% { text-shadow: 0 0 20px #00ff99, 0 0 40px #00ff99, 0 0 60px #00ff99; }
    }
    @keyframes move {
      0% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.2) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }
  </style>
</head>
<body>
  <h1>I LOVE U ♾️</h1>
</body>
</html>
